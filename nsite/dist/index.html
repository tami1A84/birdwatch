  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F2F2F7">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
  <title>birdwatch</title>
  <meta name="apple-mobile-web-app-capable" content="yes">

      させる。app-bar の safe-area-inset-top パディング(nsite style block)
       とセット。タブ表示には影響しない。 -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="birdwatch">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <!-- 2026-09-10 N: style.css をインライン化。nsite.lol が .css を text/plain で配信する(拡張子対応表に無し+blossom.primal.net が upload時の content-type を無視)ため、Safari/新版Chromeは MIME 不正の スタイルシートを標準モードで拒否し、サイト全体が非スタイル(画像だけ ナチュラルサイズ、テキストは黒地に黒で不可視)になっていた。style.css ファイルと sw.js の precache は残す(オフライン/将来の gateway 改善用)。 -->
    <style>
/*
 * birdwatch — stylesheet
 *
 * Base layer: typography, resets, tokens, feed rows, dialogs.
 * Avatars: rounded squares (12px radius) per Birdwatch original design.
 * Liquid glass: non-sticky header, floating 3-element bottom navigation,
 *   live refraction and multi-pass highlight rims.
 */

/* ---------------------------------------------------------------- fonts */

@font-face {
  font-family: "Roboto Serif";
  src: url("roboto-serif-latin.woff2") format("woff2");
  font-weight: 100 900;
  font-style: normal;
  font-display: swap;
}

@font-face {
  font-family: "Material Symbols Rounded";
  src: url("material-symbols-rounded.woff2") format("woff2");
  font-weight: 100 700;
  font-style: normal;
  font-display: block;
}

.msr {
  font-family: "Material Symbols Rounded";
  font-weight: normal;
  font-style: normal;
  line-height: 1;
  letter-spacing: normal;
  text-transform: none;
  display: inline-block;
  white-space: nowrap;
  word-wrap: normal;
  direction: ltr;
  font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
  -webkit-font-smoothing: antialiased;
  user-select: none;
}

.msr--fill { font-variation-settings: "FILL" 1, "wght" 400, "GRAD" 0, "opsz" 24; }
.msr--outline { font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24; }
.msr--inline { font-size: 14px; vertical-align: -2px; }

/* ---------------------------------------------------------------- tokens */

:root {
  color-scheme: light;
  --font-ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif;

  --bw-ink: #111114;
  --bw-muted: #6e6e77;
  --bw-accent: #0071e3;
  --bw-canvas: #f2f2f7;
  --bw-paper: #ffffff;
  --bw-line: rgba(60, 60, 67, 0.12);
  --bw-field: #e5e5ea;

  /* Liquid glass tokens (light) */
  --lg-bg: rgba(255, 255, 255, 0.65);
  --lg-bg-active: rgba(255, 255, 255, 0.85);
  --lg-border-outer: rgba(255, 255, 255, 0.7);
  --lg-border-inner: rgba(255, 255, 255, 0.35);
  --lg-highlight: rgba(255, 255, 255, 0.85);
  --lg-shadow:
    0 12px 32px rgba(18, 22, 38, 0.12),
    0 2px 8px rgba(18, 22, 38, 0.05),
    inset 0 1px 0 var(--lg-highlight);

  --radius-card: 16px;
  --radius-md: 12px;
  --radius-sm: 10px;
  --ease-ios: cubic-bezier(0.32, 0.72, 0, 1);

  /* Material components compatibility tokens */
  --md-sys-color-primary: #0071e3;
  --md-sys-color-on-primary: #ffffff;
  --md-sys-color-primary-container: #dbeafa;
  --md-sys-color-on-primary-container: #0051a5;
  --md-sys-color-surface: #ffffff;
  --md-sys-color-on-surface: #111114;
  --md-sys-color-on-surface-variant: #63636c;
  --md-sys-color-error: #ff3b30;
  --md-dialog-container-shape: 26px;
  --md-filled-button-container-shape: 12px;
  --md-text-button-container-shape: 12px;
}

@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bw-ink: #f5f5f7;
    --bw-muted: #98989f;
    --bw-accent: #2997ff;
    --bw-canvas: #000000;
    --bw-paper: #1c1c1e;
    --bw-line: rgba(235, 235, 245, 0.14);
    --bw-field: #2c2c2e;

    /* Liquid glass tokens (dark) */
    --lg-bg: rgba(36, 36, 42, 0.65);
    --lg-bg-active: rgba(56, 56, 64, 0.82);
    --lg-border-outer: rgba(255, 255, 255, 0.2);
    --lg-border-inner: rgba(255, 255, 255, 0.09);
    --lg-highlight: rgba(255, 255, 255, 0.25);
    --lg-shadow:
      0 16px 40px rgba(0, 0, 0, 0.55),
      0 3px 10px rgba(0, 0, 0, 0.35),
      inset 0 1px 0 var(--lg-highlight);

    --md-sys-color-primary: #2997ff;
    --md-sys-color-on-primary: #002244;
    --md-sys-color-surface: #1c1c1e;
    --md-sys-color-on-surface: #f5f5f7;
    --md-sys-color-on-surface-variant: #b0b0b8;
  }
}

/* ---------------------------------------------------------------- base */

*,
*::before,
*::after { box-sizing: border-box; }

html {
  -webkit-text-size-adjust: 100%;
  background: var(--bw-canvas);
}

body {
  margin: 0;
  background: var(--bw-canvas);
  color: var(--bw-ink);
  font-family: var(--font-ui);
  font-size: 16px;
  line-height: 1.5;
  letter-spacing: -0.015em;
  min-height: 100dvh;
}

a { color: inherit; text-decoration: none; }
button { font-family: inherit; }

:where(a, button, input, textarea, md-filled-button, md-text-button):focus-visible {
  outline: 2px solid var(--bw-accent);
  outline-offset: 3px;
}

/* -------------------------------------------------------- liquid glass core */

/* Layered structure:
   - Outer element sets shape, border, shadow, isolation
   - ::before carries the backdrop-filter + svg displacement refraction
   - Foreground children sit on relative z-index: 1 so text/icons stay 100% crisp */
.liquid-glass {
  position: relative;
  isolation: isolate;
  border: 1px solid var(--lg-border-outer);
  box-shadow: var(--lg-shadow);
  transition: transform 0.2s var(--ease-ios), background 0.2s ease, box-shadow 0.2s ease;
  -webkit-tap-highlight-color: transparent;
}

.liquid-glass::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: var(--lg-bg);
  -webkit-backdrop-filter: blur(22px) saturate(180%);
  backdrop-filter: blur(22px) saturate(180%);
  backdrop-filter: url(#liquid-glass-refract) blur(22px) saturate(180%);
  -webkit-backdrop-filter: url(#liquid-glass-refract) blur(22px) saturate(180%);
  pointer-events: none;
  z-index: 0;
}

/* Inner highlight stroke */
.liquid-glass::after {
  content: "";
  position: absolute;
  inset: 1px;
  border-radius: inherit;
  border: 1px solid var(--lg-border-inner);
  pointer-events: none;
  z-index: 0;
}

/* Keep text, icons, avatars sharp and unwarped */
.liquid-glass > * {
  position: relative;
  z-index: 1;
}

/* --------------------------------------------------------- header (scrolls away) */

/* No enclosing rounded capsule. Sits at the page top as a clean editorial header:
   "ホーム" on the left, profile avatar on the right, naturally scrolling away. */
.app-header {
  margin: 16px auto 4px;
  width: min(calc(100% - 32px), 620px);
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 4px;
  background: transparent;
  border: 0;
  box-shadow: none;
}

.app-header__home {
  font-size: 28px;
  font-weight: 800;
  letter-spacing: -0.04em;
  color: var(--bw-ink);
  display: inline-flex;
  align-items: center;
  padding: 0;
  transition: opacity 0.15s ease;
}

.app-header__home:active {
  opacity: 0.55;
}

.app-header__spacer {
  flex: 1;
}

.app-header__avatar {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  border: 0;
  background: transparent;
  cursor: pointer;
  border-radius: 50%;
  transition: transform 0.2s var(--ease-ios), opacity 0.15s ease;
}

.app-header__avatar:active {
  transform: scale(0.92);
  opacity: 0.75;
}

/* -------------------------------------------------------- bottom navigation */

.bottom-nav {
  position: fixed;
  left: 50%;
  bottom: max(14px, env(safe-area-inset-bottom, 14px));
  transform: translateX(-50%);
  width: min(calc(100% - 28px), 520px);
  display: flex;
  align-items: center;
  gap: 12px;
  z-index: 50;
  pointer-events: none;
}

.bottom-nav > * {
  pointer-events: auto;
}

/* Left & Right: Perfect circles */
.bottom-nav__circle {
  width: 58px;
  height: 58px;
  flex: 0 0 58px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: var(--bw-ink);
  cursor: pointer;
  padding: 0;
  border-style: solid;
}

.bottom-nav__circle .msr {
  font-size: 26px;
  transition: transform 0.2s var(--ease-ios);
}

/* Home button: keeps the same natural ink color (not blue) */
.bottom-nav__circle[aria-current="page"] {
  color: var(--bw-ink);
}

.bottom-nav__circle[aria-current="page"] .msr {
  font-variation-settings: "FILL" 1, "wght" 500, "GRAD" 0, "opsz" 24;
}

.bottom-nav__circle:active {
  transform: scale(0.88);
}

.bottom-nav__circle:active::before {
  background: var(--lg-bg-active);
}

/* Apple Notes compose icon */
.compose-icon-notes {
  display: block;
  transition: transform 0.2s var(--ease-ios);
}

/* Center: Wide rounded pill for search */
.bottom-nav__search {
  flex: 1;
  height: 58px;
  border-radius: 29px;
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 10px;
  color: var(--bw-muted);
  cursor: pointer;
}

.bottom-nav__search-icon {
  font-size: 22px;
  color: var(--bw-muted);
}

.bottom-nav__search-label {
  font-size: 15px;
  font-weight: 550;
  letter-spacing: -0.01em;
  color: var(--bw-muted);
}

.bottom-nav__search[aria-current="page"] {
  color: var(--bw-accent);
}

.bottom-nav__search[aria-current="page"] .bottom-nav__search-icon,
.bottom-nav__search[aria-current="page"] .bottom-nav__search-label {
  color: var(--bw-accent);
}

.bottom-nav__search:active {
  transform: scale(0.97);
}

.bottom-nav__search:active::before {
  background: var(--lg-bg-active);
}

/* ------------------------------------------------------------- layout */

.content {
  width: min(100%, 620px);
  margin: 0 auto;
  padding: 8px 16px calc(80px + env(safe-area-inset-bottom, 24px));
  min-height: calc(100dvh - 80px);
}

.page-title {
  font-size: clamp(28px, 7vw, 34px);
  font-weight: 760;
  line-height: 1.15;
  letter-spacing: -0.04em;
  margin: 12px 0 18px;
}

.section-title {
  font-size: 19px;
  font-weight: 700;
  letter-spacing: -0.025em;
  margin: 24px 0 10px;
}

.section-title__count {
  font-size: 13px;
  font-weight: 400;
  color: var(--bw-muted);
}

.page { display: block; }

/* ------------------------------------------------------------- timeline */

.feed {
  display: flex;
  flex-direction: column;
}

.tl-item {
  display: flex;
  gap: 12px;
  padding: 16px 0;
  border-bottom: 1px solid var(--bw-line);
}

.feed .tl-item:last-child { border-bottom: 0; }

.tl-item__avatar { flex: 0 0 auto; }

.tl-item__main {
  flex: 1;
  min-width: 0;
  position: relative;
  display: block;
}

.tl-item__open {
  position: absolute;
  inset: 0;
  z-index: 1;
  border-radius: 8px;
}

.tl-item__open:active ~ .tl-item__head,
.tl-item__open:active ~ .tl-item__body {
  opacity: 0.6;
}

.tl-item__head {
  display: flex;
  align-items: baseline;
  gap: 6px;
  min-width: 0;
}

.tl-item__name {
  font-size: 15px;
  font-weight: 680;
  line-height: 1.3;
  color: var(--bw-ink);
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  letter-spacing: -0.02em;
}

.tl-item__name--sm { font-size: 14px; }

.tl-item__time {
  flex: 0 0 auto;
  font-size: 13px;
  color: var(--bw-muted);
  line-height: 1.3;
  white-space: nowrap;
}

.tl-item__time::before { content: "·"; margin-right: 5px; color: var(--bw-muted); }

.tl-item__body {
  display: block;
  margin-top: 4px;
  font-size: 15px;
  line-height: 1.55;
  color: var(--bw-ink);
  overflow-wrap: break-word;
}

.tl-item__body a {
  position: relative;
  z-index: 2;
}

.note-url {
  color: var(--bw-accent);
  text-decoration: underline;
  text-underline-offset: 2px;
  overflow-wrap: anywhere;
}

.note-media {
  display: block;
  margin-top: 8px;
  position: relative;
  z-index: 2;
}

.note-image {
  display: block;
  max-width: 100%;
  max-height: 360px;
  border-radius: 12px;
  background: var(--bw-field);
}

.tl-item--detail { border-bottom: 0; padding: 20px 0 8px; }
.tl-item__body--detail { font-size: 17px; line-height: 1.6; margin-top: 6px; }

.tl-item--comment { border-bottom: 0; padding: 10px 0; }
.tl-item--comment .tl-item__body { font-size: 15px; }

.comments {
  display: flex;
  flex-direction: column;
  margin-top: 4px;
}

.comments .tl-item + .tl-item {
  border-top: 1px solid var(--bw-line);
}

/* ------------------------------------------------------------- avatars */

/* Birdwatch canonical: rounded square (12px radius), NOT a circle */
.avatar {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  flex: 0 0 auto;
  border-radius: var(--radius-md); /* 12px */
  background: var(--bw-field);
  color: var(--bw-muted);
}

.avatar img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: var(--radius-md);
}

.avatar .avatar__fallback { display: none; }
.avatar:not(:has(img)) .avatar__fallback,
.avatar--fallback .avatar__fallback { display: inline-block; }
.avatar--fallback img { display: none; }

.avatar--sm { width: 34px; height: 34px; border-radius: 10px; }
.avatar--sm img { border-radius: 10px; }
.avatar--sm .avatar__fallback { font-size: 24px; }

.avatar--md { width: 40px; height: 40px; border-radius: 12px; }
.avatar--md img { border-radius: 12px; }
.avatar--md .avatar__fallback { font-size: 28px; }

.avatar--lg { width: 44px; height: 44px; border-radius: 12px; }
.avatar--lg img { border-radius: 12px; }
.avatar--lg .avatar__fallback { font-size: 32px; }

.avatar--xl { width: 64px; height: 64px; border-radius: 16px; }
.avatar--xl img { border-radius: 16px; }
.avatar--xl .avatar__fallback { font-size: 48px; }

/* The logged-in user's own avatar in the header is the only circle.
   Must sit after .avatar--* so its 50% radius beats .avatar--sm. */
.app-header__avatar .avatar,
.app-header__avatar .avatar img {
  border-radius: 50% !important;
}

/* --------------------------------------------------------- note actions */

.thread-section { margin-top: 8px; }

.note-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  min-height: 40px;
}

.note-actions__form { display: inline-flex; }

.like-button .msr { font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24; }

.like-button--liked .msr {
  font-variation-settings: "FILL" 1, "wght" 400, "GRAD" 0, "opsz" 24;
  color: var(--bw-accent);
}

.note-actions__count {
  font-size: 13px;
  color: var(--bw-muted);
  margin-right: 8px;
}

.fav-toggle {
  border: 0;
  background: none;
  padding: 8px;
  cursor: pointer;
  color: var(--bw-muted);
  border-radius: 50%;
  transition: transform 0.2s var(--ease-ios);
}

.fav-toggle:active { transform: scale(0.88); }
.fav-toggle[data-fav="1"] .msr {
  font-variation-settings: "FILL" 1, "wght" 400, "GRAD" 0, "opsz" 24;
  color: #f59e0b;
}

.note-actions__form--end { margin-left: auto; }

.danger-button {
  --md-text-button-label-text-color: #ff3b30;
  --md-text-button-icon-color: #ff3b30;
}

.reply-box {
  margin: 12px 0 6px;
  background: var(--bw-paper);
  border-radius: var(--radius-card);
  padding: 14px;
}

.reply-form { display: flex; flex-direction: column; gap: 8px; }
.reply-form__submit { align-self: flex-end; }

/* ------------------------------------------------------------- compose */

.compose-textarea {
  width: 100%;
  border: 1px solid var(--bw-line);
  border-radius: 12px;
  background: var(--bw-field);
  color: var(--bw-ink);
  font-family: var(--font-ui);
  font-size: 16px;
  line-height: 1.5;
  padding: 12px 14px;
  outline: none;
  resize: vertical;
}

.compose-textarea:focus {
  border-color: var(--bw-accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--bw-accent), transparent 82%);
}

.compose-textarea--compact { font-size: 15px; }

.compose-image {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 10px;
  font-size: 13px;
  font-weight: 600;
  color: var(--bw-accent);
  cursor: pointer;
  padding: 6px 8px;
  border-radius: 8px;
}

.compose-image input[type="file"] {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  opacity: 0;
  cursor: pointer;
}

.compose-image__preview-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 10px;
}

.compose-image__preview-row[hidden] { display: none; }

.compose-image__preview {
  width: 56px;
  height: 56px;
  object-fit: cover;
  border-radius: var(--radius-sm);
  background: var(--bw-field);
}

.compose-image__name {
  flex: 1;
  min-width: 0;
  font-size: 12px;
  color: var(--bw-muted);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.compose-image__clear { flex: none; }

/* ------------------------------------------------------ settings & rows */

.settings-card,
.profile-header,
.follow-row,
.relay-row {
  background: var(--bw-paper);
  border-radius: var(--radius-card);
  margin-bottom: 12px;
  box-shadow: 0 1px 0 var(--bw-line);
}

.settings-card { padding: 18px 20px; }
.settings-card__title { font-size: 17px; font-weight: 700; margin: 0 0 12px; }
.settings-card__body { margin: 8px 0; color: var(--bw-muted); font-size: 14px; line-height: 1.5; }
.settings-card__body--muted { font-size: 12px; }

.settings-row {
  display: flex;
  gap: 12px;
  padding: 8px 0;
  align-items: baseline;
}

.settings-row + .settings-row { border-top: 1px solid var(--bw-line); }

.settings-row__label {
  flex: 0 0 88px;
  font-size: 13px;
  color: var(--bw-muted);
}

.settings-row__value { min-width: 0; overflow-wrap: anywhere; font-size: 14px; }

.settings-form { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }

.field { display: flex; flex-direction: column; gap: 4px; width: 100%; }
.field__label { font-size: 12px; font-weight: 700; color: var(--bw-muted); }

.add-box { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.add-form { display: flex; gap: 8px; align-items: stretch; }

.add-form__input,
.search-input,
.field__input {
  flex: 1;
  min-width: 0;
  font-family: inherit;
  font-size: 16px;
  color: var(--bw-ink);
  background: var(--bw-field);
  border: 1px solid transparent;
  border-radius: 12px;
  padding: 12px 14px;
  outline: none;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}

.add-form__input:focus,
.search-input:focus,
.field__input:focus {
  border-color: var(--bw-accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--bw-accent), transparent 82%);
}

.search-form { display: flex; gap: 8px; align-items: stretch; margin-bottom: 20px; }
.search-form md-filled-button { align-self: stretch; }

.follow-list,
.profile-list,
.relay-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.profile-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px;
  border-radius: var(--radius-sm);
  min-width: 0;
  flex: 1;
}

.profile-row__avatar { font-size: 36px; color: var(--bw-muted); }

.profile-row__body { display: flex; flex-direction: column; min-width: 0; }
.profile-row__name { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.profile-row__sub { font-size: 13px; color: var(--bw-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.follow-row {
  display: flex;
  align-items: center;
  padding: 6px 10px 6px 4px;
}

.relay-section {
  margin: 20px 4px 6px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.04em;
  color: var(--bw-muted);
}

.relay-row {
  position: relative;
  padding: 12px 44px 12px 16px;
}

.relay-row--read {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 16px;
}

.relay-row__head { display: flex; align-items: center; gap: 8px; }
.relay-row__url { font-size: 15px; font-weight: 700; min-width: 0; overflow-wrap: anywhere; }

.state-badge {
  margin-left: auto;
  flex: 0 0 auto;
  font-size: 12px;
  font-weight: 700;
  padding: 2px 10px;
  border-radius: 999px;
  background: var(--bw-field);
  color: var(--bw-muted);
}

.state-badge--connected {
  background: var(--bw-accent);
  color: #ffffff;
}

.relay-flags {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 12px;
  margin-top: 8px;
  align-items: center;
}

.relay-flag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 13px;
  color: var(--bw-muted);
  cursor: pointer;
}

.relay-flag input { accent-color: var(--bw-accent); }

.relay-remove {
  position: absolute;
  top: 8px;
  right: 4px;
  --md-icon-button-icon-color: #ff3b30;
}

.advertise-button { align-self: flex-start; }

/* ------------------------------------------------------------- profile */

.profile-header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px;
}

.profile-header__body { min-width: 0; flex: 1; }
.profile-header__name { font-size: 20px; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
.profile-header__sub { font-size: 13px; color: var(--bw-muted); }
.profile-header__nip05 { display: flex; align-items: center; gap: 4px; }
.profile-about { margin: 8px 4px 0; color: var(--bw-muted); font-size: 15px; line-height: 1.5; }

.follow-button,
.following-button {
  border: 0;
  cursor: pointer;
  font-family: inherit;
  font-size: 14px;
  font-weight: 700;
  padding: 10px 16px;
  border-radius: var(--radius-md);
  background: var(--bw-accent);
  color: #ffffff;
  transition: transform 0.2s var(--ease-ios);
}

.following-button {
  background: var(--bw-field);
  color: var(--bw-ink);
}

.follow-button:active,
.following-button:active { transform: scale(0.95); }

/* --------------------------------------------------------- empty state */

.empty-state {
  text-align: center;
  padding: 48px 24px;
  color: var(--bw-muted);
}

.empty-state--page { padding-top: 72px; }
.empty-state--compact { padding: 24px; }
.empty-state__icon { font-size: 40px; color: var(--bw-accent); opacity: 0.8; }
.empty-state__title { font-size: 17px; font-weight: 700; color: var(--bw-ink); margin: 12px 0 4px; }
.empty-state__body { font-size: 13px; line-height: 1.5; margin: 0 0 16px; }

/* ---------------------------------------------------------- toast/dialog */

.flash { display: none; }

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(88px + env(safe-area-inset-bottom, 14px));
  transform: translate(-50%, 16px);
  z-index: 60;
  max-width: min(420px, calc(100vw - 32px));
  background: var(--bw-ink);
  color: var(--bw-canvas);
  border-radius: 14px;
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.22);
  padding: 12px 18px;
  font-size: 14px;
  line-height: 1.4;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease, transform 0.3s var(--ease-ios);
}

.toast--show {
  opacity: 1;
  transform: translate(-50%, 0);
  pointer-events: auto;
}

.compose-dialog,
.confirm-dialog {
  --md-dialog-container-shape: 26px;
}

.compose-dialog md-dialog,
.confirm-dialog md-dialog { max-width: 420px; }

.confirm-dialog__text { margin: 0; font-size: 15px; line-height: 1.5; }

/* ---------------------------------------------------- reduced motion / transparency */

@media (prefers-reduced-transparency: reduce) {
  .liquid-glass {
    background: var(--bw-paper);
    -webkit-backdrop-filter: none;
    backdrop-filter: none;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition-duration: 0.01ms !important;
    animation-duration: 0.01ms !important;
  }
}

                placeholder="いま何をしている？"></textarea>
      <div class="compose-image__preview-row" id="compose-image-preview-row" hidden>
        <img class="compose-image__preview" id="compose-image-preview" alt="">
        <span class="compose-image__name" id="compose-image-name"></span>
        <md-icon-button class="compose-image__clear" id="compose-image-clear" aria-label="写真を取り消す">
          <span class="msr">close</span>
        </md-icon-button>
      </div>
      <label class="compose-image">
        <input type="file" id="compose-image" accept="image/png,image/jpeg,image/gif,image/webp">
        <span class="msr">image</span><span class="compose-image__label">写真を追加（10MBまで）</span>
      </label>
      <div class="compose-sheet__actions">
        <md-text-button id="compose-cancel">キャンセル</md-text-button>
        <md-filled-button id="compose-submit">投稿</md-filled-button>
      </div>
      <div class="compose-sheet-safe"></div>
    </div>
  </div>

  <md-dialog id="qr-dialog">
    <div slot="headline">QRをスキャン</div>
    <div slot="content">
      <video id="qr-video" class="qr-video" playsinline muted></video>
      <p class="settings-card__body settings-card__body--muted" id="qr-status">カメラを起動しています…</p>
    </div>
    <div slot="actions">
      <md-text-button id="qr-cancel">キャンセル</md-text-button>
    </div>
  </md-dialog>

  <md-dialog id="search-dialog">
    <div slot="headline">検索</div>
    <div slot="content">
      <form id="search-form" class="search-form">
        <input id="search-input" class="search-input" type="search" enterkeyhint="search"
               placeholder="投稿やプロフィールを検索" autocomplete="off">
        <md-filled-button type="submit" aria-label="検索">
          <span class="msr" slot="icon">search</span>
        </md-filled-button>
      </form>
      <div id="search-results"></div>
    </div>
    <div slot="actions">
      <md-text-button id="search-close">閉じる</md-text-button>
    </div>
  </md-dialog>

  <div id="app-toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    // 万一 app.js が読み込めなかった時の逃げ道: 12秒でスプラッシュを外す。
    // ただし app.js モジュールが評価済み(data-bw-booted)なら何もしない —
    // 回線が遅いだけの時に空のシェルを見せてしまうのを防ぐ(review指摘)。
    // その場合のrevealは app.js 側の revealApp() が担う。
    setTimeout(function () {
      if (document.documentElement.hasAttribute('data-bw-booted')) return
      if (document.body) document.body.classList.remove('booting')
      var s = document.getElementById('splash')
      if (s) s.remove()
    }, 12000)
  </script>
</body>
</html>
